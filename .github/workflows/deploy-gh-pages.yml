# 仅构建 frontend-react，产出推到 GitHub Pages。
# VITE_API_BASE_URL 必须在 build 时注入，否则 bundle 里仍是 localhost，线上无法连后端。
# 在 Repo → Settings → Secrets and variables → Actions → Variables 新建 VITE_API_BASE_URL（公网后端 origin，不要 /v1）
# 未设置变量时使用下方默认 Azure 地址。

name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend-react

      # BASE_PATH 与仓库名一致，如 https://<user>.github.io/<repo>/
      # VITE_API_BASE_URL：生产后端，构建时写入 bundle
      - name: Build
        run: npm run build
        working-directory: frontend-react
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # 优先用仓库 Variable；本地手动 build 请复制 frontend-react/.env.production.example 为 .env.production
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://ami-backend.whiteflower-dafb3d91.eastus.azurecontainerapps.io' }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-react/dist

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
